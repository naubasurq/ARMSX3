name: android-winfg
on:
  push:
    branches: [winfg]
  workflow_dispatch:
    inputs:
      variant:
        description: "legacy | a11 | a13 | a15"
        default: "a11"

env:
  VARIANT: ${{ github.event.inputs.variant || 'a11' }}
  NDK_VERSION: 29.0.14206865
  CMAKE_VERSION: 3.30.5
  CCACHE_DIR: /mnt/ccache
  CCACHE_MAXSIZE: 4G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Liberar disco y preparar /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/ccache /mnt/build && sudo chown -R $USER /mnt/ccache /mnt/build
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          df -h / /mnt

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Restaurar ccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ccache
          key: ccache-${{ env.VARIANT }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.VARIANT }}-

      - name: NDK 29 y CMake
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Compilar el core (LLVM + RPCS3, tarda horas)
        timeout-minutes: 310
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          case "$VARIANT" in
            legacy) API=30; MARCH=armv8.1-a ;;
            a11)    API=30; MARCH=armv8.2-a+dotprod+fp16 ;;
            a13)    API=33; MARCH=armv8.2-a+dotprod+fp16 ;;
            a15)    API=35; MARCH=armv8.2-a+dotprod+fp16 ;;
          esac
          echo "API=$API" >> $GITHUB_ENV
          bash android/stamp-git-version.sh
          NDK_VERSION=$NDK_VERSION ANDROID_API=$API BUILD_DIR=/mnt/build \
            bash android/configure.sh "-DARMSX3_ARM_MARCH=$MARCH" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="$ANDROID_HOME/cmake/$CMAKE_VERSION/bin:$PATH"
          ninja -C /mnt/build android/libarmsx3-core.so
          ninja -C /mnt/build armsx3_lsfg || echo "armsx3_lsfg no se compilo (ok: win-fg va dentro del core)"

      - name: Guardar ccache (aunque haya fallado o se acabe el tiempo)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/ccache
          key: ccache-${{ env.VARIANT }}-${{ github.run_id }}

      - name: Empaquetar APK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          STRIP=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          UI=android/armsx3-ui
          mkdir -p $UI/app/src/main/jniLibs/arm64-v8a
          $STRIP --strip-unneeded -o $UI/app/src/main/jniLibs/arm64-v8a/libarmsx3-core.so /mnt/build/android/libarmsx3-core.so
          if [ -f /mnt/build/3rdparty/lsfg/libarmsx3_lsfg.so ]; then
            mkdir -p $UI/app/src/github/jniLibs/arm64-v8a
            $STRIP --strip-unneeded -o $UI/app/src/github/jniLibs/arm64-v8a/libarmsx3_lsfg.so /mnt/build/3rdparty/lsfg/libarmsx3_lsfg.so
          fi
          (cd $UI && ./gradlew --no-daemon :app:assembleGithubRelease "-Parmsx3.minSdk=$API")
          mkdir -p out
          APK=$(find $UI/app/build/outputs/apk/github/release -name '*.apk' | head -1)
          echo "APK generado: $APK"
          # Si salio sin firmar, se firma con una llave temporal para poder instalarlo
          if echo "$APK" | grep -q unsigned; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            keytool -genkeypair -keystore /tmp/k.jks -storepass android -keypass android -alias k \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=armsx3"
            $BT/zipalign -f 4 "$APK" /tmp/aligned.apk
            $BT/apksigner sign --ks /tmp/k.jks --ks-pass pass:android --out out/ARMSX3-winfg-$VARIANT.apk /tmp/aligned.apk
          else
            cp "$APK" out/ARMSX3-winfg-$VARIANT.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ARMSX3-winfg-${{ env.VARIANT }}
          path: out/*.apk
